<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Salvador Trails — Página Inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root {
  --ivory: #FDF8ED;
  --ivory-deep: #F7EEDA;
  --maroon: #7E1500;
  --gold-pale: #FAD170;
  --gold-amber: #E6B300;
  --red-orange: #D12400;
  --olive: #A9BF01;
  --green: #4BC000;
  --teal: #00C9B9;
  --aqua-pale: #9EFAF3;
  --ink: #3A2416;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #E7E2D6;
  font-family: 'Work Sans', sans-serif;
  color: var(--ink);
}
.page-frame {
  width: 1440px;
  margin: 0 auto;
  background: var(--ivory);
  position: relative;
  overflow: hidden;
}
/*----------decorative dash divider----------*/
.dash-divider {
  height: 1px;
  width: 100%;
  background: repeating-linear-gradient(90deg, var(--maroon) 0 16px, transparent 16px 30px);
  opacity: .28;
}
.dash-divider.thick { height: 2px; opacity: .22; }

/*================= NAV =================*/
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 56px;
  height: 92px;
  background: var(--ivory);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark { width: 34px; height: 34px; flex-shrink: 0; }
.brand-word {
  font-family: 'Fraunces', serif;
  font-size: 23px;
  letter-spacing: .01em;
  color: var(--maroon);
  line-height: 1;
}
.brand-word em {
  font-style: italic;
  font-weight: 500;
  color: var(--red-orange);
}
.brand-sub {
  display: block;
  font-family: 'Work Sans', sans-serif;
  font-size: 10.5px;
  letter-spacing: .16em;
  color: var(--olive);
  margin-top: 3px;
  font-weight: 600;
}
.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
}
.nav-links a {
  text-decoration: none;
  color: var(--ink);
  font-size: 14.5px;
  font-weight: 500;
  letter-spacing: .02em;
  padding-bottom: 6px;
  border-bottom: 2px solid transparent;
  transition: border-color .2s, color .2s;
}
.nav-links a:hover { color: var(--red-orange); border-color: var(--gold-amber); }
.nav-links a.active { color: var(--maroon); border-color: var(--gold-amber); font-weight: 600; }
.nav-right {
  display: flex;
  align-items: center;
  gap: 18px;
}
.tutorial-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1.4px solid var(--teal);
  color: var(--maroon);
  border-radius: 999px;
  padding: 7px 14px 7px 10px;
  font-family: 'Work Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .02em;
  cursor: pointer;
  transition: background .2s;
}
.tutorial-btn:hover { background: var(--aqua-pale); }
.tutorial-btn svg { width: 16px; height: 16px; }
.lang-switch {
  display: flex;
  align-items: center;
  background: var(--ivory-deep);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.lang-switch button {
  border: none;
  background: transparent;
  font-family: 'Work Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .03em;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  color: var(--maroon);
  opacity: .55;
}
.lang-switch button.active {
  background: var(--teal);
  color: #fff;
  opacity: 1;
}

/*================= HERO =================*/
.hero { padding: 34px 56px 0; }
.hero-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
}
.eyebrow {
  font-family: 'Work Sans', sans-serif;
  font-size: 13px;
  letter-spacing: .12em;
  color: var(--maroon);
  font-weight: 600;
}
.eyebrow::before {
  content: "";
  display: inline-block;
  width: 22px;
  height: 1.5px;
  background: var(--red-orange);
  margin-right: 10px;
  vertical-align: middle;
}
.destination-count {
  font-size: 12.5px;
  color: var(--ink);
  opacity: .5;
  letter-spacing: .03em;
}
.tabs {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.tab-btn {
  font-family: 'Work Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .02em;
  padding: 10px 20px;
  border-radius: 999px;
  border: 1.4px solid rgba(126,21,0,.28);
  background: transparent;
  color: var(--maroon);
  cursor: pointer;
  transition: all .2s ease;
}
.tab-btn:hover { border-color: var(--red-orange); color: var(--red-orange); }
.tab-btn.active {
  background: var(--gold-amber);
  border-color: var(--gold-amber);
  color: var(--maroon);
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(230,179,0,.35);
}
.hero-media {
  position: relative;
  width: 100%;
  height: 560px;
  border-radius: 6px;
  overflow: hidden;
  background: var(--ink);
}
.hero-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity .35s ease;
}
.scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, rgba(126,21,0,.86) 0%, rgba(126,21,0,.62) 26%, rgba(126,21,0,.14) 52%, rgba(126,21,0,0) 68%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 48px 64px 52px 56px;
}
.leaf-watermark {
  position: absolute;
  top: 28px;
  left: 36px;
  width: 120px;
  height: 120px;
  opacity: .16;
  stroke: var(--gold-pale);
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  letter-spacing: .14em;
  color: var(--gold-pale);
  font-weight: 600;
  margin-bottom: 16px;
}
.hero-tag svg { width: 13px; height: 13px; }
.hero-headline {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 46px;
  line-height: 1.08;
  color: #fff;
  max-width: 640px;
  margin-bottom: 16px;
  letter-spacing: .001em;
}
.hero-sub {
  font-size: 15.5px;
  line-height: 1.6;
  color: rgba(255,255,255,.88);
  max-width: 460px;
  margin-bottom: 28px;
  font-weight: 400;
}
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--gold-amber);
  color: var(--maroon);
  border: none;
  padding: 14px 26px;
  border-radius: 4px;
  font-family: 'Work Sans', sans-serif;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: .02em;
  cursor: pointer;
  width: fit-content;
  transition: background .2s, transform .2s;
}
.hero-cta:hover { background: var(--red-orange); color: #fff; transform: translateX(2px); }
.hero-cta svg { width: 16px; height: 16px; }

/* thumbnail strip */
.thumbs {
  display: flex;
  gap: 14px;
  padding: 18px 0 30px;
}
.thumb-btn {
  position: relative;
  width: 150px;
  height: 90px;
  border-radius: 4px;
  overflow: hidden;
  border: 2.5px solid transparent;
  cursor: pointer;
  padding: 0;
  background: none;
  flex-shrink: 0;
}
.thumb-btn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(.82);
  transition: filter .2s;
}
.thumb-btn:hover img { filter: brightness(1); }
.thumb-btn.active { border-color: var(--gold-amber); }
.thumb-btn.active img { filter: brightness(1); }
.thumb-label {
  position: absolute;
  left: 8px;
  bottom: 6px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  letter-spacing: .02em;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

/*================= SOCIAL ROW =================*/
.social-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 38px 0 46px;
}
.social-label {
  font-size: 12px;
  letter-spacing: .16em;
  font-weight: 600;
  color: var(--ink);
  opacity: .5;
}
.social-icons {
  display: flex;
  gap: 16px;
}
.social-icons a {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1.4px solid rgba(126,21,0,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--maroon);
  transition: all .2s ease;
}
.social-icons a svg { width: 18px; height: 18px; }
.social-icons a:nth-child(1):hover { background: var(--teal); border-color: var(--teal); color: #fff; }
.social-icons a:nth-child(2):hover { background: var(--maroon); border-color: var(--maroon); color: #fff; }
.social-icons a:nth-child(3):hover { background: var(--red-orange); border-color: var(--red-orange); color: #fff; }
.social-icons a:nth-child(4):hover { background: var(--gold-amber); border-color: var(--gold-amber); color: #fff; }
.foot-space { height: 20px; }
</style>
</head>
<body>
<div class="page-frame">
  <!--================= NAV =================-->
  <header class="nav">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#7E1500" stroke-width="1.3" opacity=".55">
          <line x1="20" y1="1" x2="20" y2="7"/>
          <line x1="20" y1="1" x2="20" y2="7" transform="rotate(30 20 20)"/>
          <line x1="20" y1="1" x2="20" y2="7" transform="rotate(60 20 20)"/>
          <line x1="20" y1="1" x2="20" y2="7" transform="rotate(90 20 20)"/>
          <line x1="20" y1="1" x2="20" y2="7" transform="rotate(120 20 20)"/>
          <line x1="20" y1="1" x2="20" y2="7" transform="rotate(150 20 20)"/>
          <line x1="20" y1="1" x2="20" y2="7" transform="rotate(-30 20 20)"/>
        </g>
      </svg>
      <div>
        <span class="brand-word">El Salvador<em>Trails</em></span>
        <span class="brand-sub">SENDERISMO Y AVENTURA</span>
      </div>
    </div>
    
    <ul class="nav-links">
      <li><a href="#" class="active">Inicio</a></li>
      <li><a href="#">Rutas</a></li>
      <li><a href="#">Destinos</a></li>
      <li><a href="#">Comunidad</a></li>
    </ul>

    <div class="nav-right">
      <button class="tutorial-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        Tutorial
      </button>
      <div class="lang-switch">
        <button class="active">ES</button>
</head>
